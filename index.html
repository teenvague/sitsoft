<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#010000" />
  <title>Sit Soft — Brand Strategy Session</title>
  <link rel="icon" type="image/png" href="favicon-sitsoft.png" />

  <meta name="description" content="A tap-through set of brand strategy questions for Sit Soft." />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://teenvague.github.io/sitsoft/" />
  <meta property="og:title" content="Sit Soft — Brand Strategy Session" />
  <meta property="og:description" content="A tap-through set of brand strategy questions for Sit Soft." />
  <meta property="og:image" content="https://teenvague.github.io/sitsoft/mediacard-sitsoft.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Sit Soft wordmark with a flower mark, black on chartreuse." />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Sit Soft — Brand Strategy Session" />
  <meta name="twitter:description" content="A tap-through set of brand strategy questions for Sit Soft." />
  <meta name="twitter:image" content="https://teenvague.github.io/sitsoft/mediacard-sitsoft.png" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app" class="app" aria-live="polite">
    <section class="card" id="card">
      <div class="card-inner">
        <header class="section-title" id="sectionTitle"></header>
        <div class="question-wrap">
          <div class="question" id="question"></div>
        </div>
        <footer class="progress" id="progress" aria-hidden="true"></footer>
      </div>
    </section>

    <!-- The tap zones are labels for the switch below, so a real finger tap
         toggles it natively. A scripted .click() does not reliably fire the
         iOS haptic; a genuine interaction does. -->
    <label class="tap-zone tap-zone--prev" id="prevZone" for="hapticSwitch"
           role="button" aria-label="Previous card"></label>
    <label class="tap-zone tap-zone--next" id="nextZone" for="hapticSwitch"
           role="button" aria-label="Next card"></label>

    <!-- iOS 17.4+ fires a system haptic when a checkbox with the switch
         attribute is toggled. It must stay rendered to work. -->
    <div class="haptic-host" aria-hidden="true">
      <input type="checkbox" id="hapticSwitch" switch tabindex="-1" />
    </div>
  </main>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
